"use strict";

const cv=document.getElementById('c'),ctx=cv.getContext('2d');const W=960,H=540;let sc=1,ox=0,oy=0;

{n:'Watermelon',e:'🍉',c:'#3cb043',spd:.8,hp:125,ab:'Seed Barrage',ai:'⚫',ad:'7 seeds, 4 dmg each',puns:["One in a melon!","Seed you later!","Melon-choly for you!"]},
{n:'Pineapple',e:'🍍',c:'#f4c430',spd:.95,hp:110,ab:'Spike Shield',ai:'🛡️',ad:'5s shield blocks all damage, reflects 50% of melee; 8 dmg spike burst',puns:["Pine-apple of my eye!","Stay sharp!","Tropic like it's hot!"]},

{n:'Sea',sky:['#5ec4ff','#d6f3ff'],sun:'#ffffff',far:'#4a90c8',mid:'#3a7fb8',near:'#2d6fa5',top:'#4fb3e8',soil:'#1c5fa8',tw:'Waves: slow moves, floaty jumps',slow:.6,grav:.6,sea:1,terr:(x,t)=>405-12*Math.sin(x/60-t*2)-6*Math.sin(x/23+t*3),deco:['🐟','🐙','🐠']},

{n:'Jungle',sky:['#1f5e2a','#6bb36b'],sun:'#d8ffb0',far:'#2b6b33',mid:'#225a2a',near:'#1a4a22',top:'#4c8f2e',soil:'#4a3420',tw:'Bumpy roots + vines: super jumps',jump:1.35,terr:x=>402-18*Math.sin(x/70)-16*Math.abs(Math.sin(x/170)),deco:['🌴','🐒','🌿']},
{n:'Farm',sky:['#8fd0ff','#fff3c4'],sun:'#fffbe0',far:'#b5d98a',mid:'#a1c96f',near:'#8db85c',top:'#9bcf5a',soil:'#8d6e3f',tw:'Flat field + bouncy haybale',hay:1,terr:x=>400,deco:['🏚️','🐄','🚜']}];

const BTNS=[{p:0,a:'L',x:60,y:475},{p:0,a:'R',x:150,y:475},{p:0,a:'J',x:105,y:400},{p:0,a:'A',x:245,y:455},{p:0,a:'S',x:255,y:365,r:32},{p:1,a:'L',x:720,y:475},{p:1,a:'R',x:810,y:475},{p:1,a:'J',x:765,y:400},{p:1,a:'A',x:900,y:455},{p:1,a:'S',x:890,y:365,r:32}];

function click(g){if(state==='menu'){for(let s=0;s<2;s++)for(let i=0;i<6;i++){const x=(s?560:80)+(i%3)*110,y=170+Math.floor(i/3)*110;if(g.x>x&&g.x<x+95&&g.y>y&&g.y<y+95)pick[s]=i}
 for(let i=-1;i<5;i++){const x=150+(i+1)*110;if(g.y>420&&g.y<460&&g.x>x&&g.x<x+100)arenaSel=i}
 if(g.y>475&&g.x>380&&g.x<580)startMatch();}else if(state!=='fight')tapAny();}

function inp(i){const k=i?{L:['ArrowLeft'],R:['ArrowRight'],J:['ArrowUp'],A:['Slash','Enter'],S:['Period','ShiftRight']}:{L:['KeyA'],R:['KeyD'],J:['KeyW'],A:['KeyF'],S:['KeyG','ShiftLeft']};const o={};for(const a in k)o[a]=k[a].some(c=>keys[c])||tin[i][a];return o}
// ---------- flow ----------
function startMatch(){wins=[0,0];round=0;nextRound();}
function rollW(){let r=Math.random()*100;for(const w of WEAP){if((r-=w.p)<0)return w}return WEAP[0]}
function nextRound(){round++;arena=arenaSel<0?ARENAS[Math.random()*5|0]:ARENAS[arenaSel];gt=0;
 P=[0,1].map(i=>{const f=FRUITS[pick[i]],x=i?720:240;return{i,f,x,y:terr(x),vx:0,vy:0,face:i?-1:1,hp:f.hp,max:f.hp,cd:0,atk:0,hurt:0,w:null,ground:true,used:false,st:{},splats:[]}});
 projs=[];parts=[];traps=[];timer=120;heatT=0;cel=null;wheel={t:0,res:[rollW(),rollW()],done:false};
 wheel.ang=wheel.res.map(w=>{let a=0;for(const x of WEAP){if(x===w)return a+x.p/200;a+=x.p/100}});state='wheel';}

// ---------- combat ----------
function burst(x,y,c,n=12,s=5){for(let k=0;k<n;k++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*6,l:1,c,s})}
function hit(t,d,dir,src,o={}){
 if(t.st.shield>0){burst(t.x,t.y-40,'#9ef',8,4);if(src&&o.melee){src.hp=Math.max(0,src.hp-d*.5);burst(src.x,src.y-40,src.f.c)}return false}
 t.hp=Math.max(0,t.hp-d);t.hurt=.25;const kb=o.kb??6;t.vx+=dir*kb;t.vy=-(o.up??4);t.ground=false;burst(t.x,t.y-40,t.f.c);
 parts.push({x:t.x,y:t.y-90,vx:0,vy:-1.2,l:.8,txt:'-'+Math.round(d),c:'#ff3b3b',g:0});return true}
function spawnProj(o){projs.push(Object.assign({g:0,r:28,life:4},o))}
function attack(p,o){const w=p.w;p.cd=w.cd;p.atk=.2;
 if(w.proj)spawnProj({x:p.x+p.face*30,y:p.y-40,vx:p.face*w.ps,vy:w.bomb?-6:0,g:w.g,o:p.i,dmg:w.d,r:w.bomb?60:28,em:w.bomb?'🍌':w.n==='Gun'?'bullet':'➶',bomb:w.bomb});
 else if(!p.st.blind||Math.random()>.35){if(Math.abs(o.x-p.x)<w.r&&Math.abs(o.y-p.y)<70&&Math.sign(o.x-p.x)===p.face)hit(o,w.d,p.face,p,{melee:1})}}
function ability(p,o){p.used=true;window.__log.push({t:elapsed(),who:p.i,ab:p.f.ab});msg=p.f.e+' '+p.f.ab.toUpperCase()+'!';setTimeout(()=>msg='',1000);
 const f=p.face;switch(p.f.n){
 case 'Watermelon':for(let k=0;k<7;k++)spawnProj({x:p.x+f*30,y:p.y-45,vx:f*(9+Math.random()*3),vy:-4+k*.9,g:.15,o:p.i,dmg:4,r:24,em:'seed'});break;
 case 'Pineapple':p.st.shield=5;if(Math.abs(o.x-p.x)<110&&Math.abs(o.y-p.y)<90)hit(o,8,Math.sign(o.x-p.x)||f,p,{kb:14,up:7});burst(p.x,p.y-40,'#f4c430',24,6);break;
 case 'Strawberry':spawnProj({x:p.x+f*30,y:p.y-45,vx:f*8,vy:-3,g:.12,o:p.i,dmg:5,r:34,em:'jam',on:t=>{t.st.poison=6;t.st.poisonSrc=p}});break;
 case 'Banana':spawnProj({x:p.x+f*30,y:p.y-50,vx:f*6.5,vy:-7,g:.3,o:p.i,dmg:0,r:0,em:'peel',trap:1});break;
 case 'Orange':spawnProj({x:p.x+f*30,y:p.y-45,vx:f*14,vy:-1,g:.05,o:p.i,dmg:6,r:34,em:'juice',on:t=>{t.st.blind=5;t.st.slow=3;t.splats=Array.from({length:7},()=>({x:Math.random(),y:Math.random(),r:40+Math.random()*60}))}});break;
 case 'Apple':spawnProj({x:o.x,y:-80,vx:0,vy:2,g:.35,o:p.i,dmg:22,r:62,em:'bigapple',drop:1,on:t=>{t.st.stun=1}});traps.push({x:o.x,t:1,mark:1});break;}}
// ---------- update ----------
function update(dt){gt+=dt;
 if(state==='wheel'){wheel.t+=dt;if(wheel.t>3.2)wheel.done=true;return}
 if(state==='roundEnd'||state==='matchEnd'){cel.t+=dt;if(cel.type==='confetti'||state==='matchEnd'&&Math.random()<.6)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,l:3,c:cel.w.f.c,s:7,g:.02});partsU(dt);return}
 if(state!=='fight')return;timer-=dt;
 if(arena.heat){heatT+=dt;if(heatT>10){heatT=0;P.forEach(p=>p.hp=Math.max(1,p.hp-1))}}
 for(const p of P){const o=P[1-p.i],st=p.st;for(const k of ['shield','stun','slow','blind'])if(st[k]>0)st[k]-=dt;
  if(st.poison>0){st.poison-=dt;const d=2.5*dt;p.hp=Math.max(0,p.hp-d);if(st.poisonSrc)st.poisonSrc.hp=Math.min(st.poisonSrc.max,st.poisonSrc.hp+d);if(Math.random()<.2)parts.push({x:p.x+(Math.random()-.5)*40,y:p.y-60,vx:0,vy:-1,l:.6,c:'#8f4',s:5,g:0})}
  const c=st.stun>0?{}:inp(p.i);let s=5*p.f.spd*(arena.slow||1)*(st.slow>0?.5:1);
  const g0=terr(p.x),slope=(terr(p.x+6)-terr(p.x-6))/12;
  if(p.hurt>0)p.hurt-=dt;else{const dir=(c.R?1:0)-(c.L?1:0);if(dir){p.face=dir;s*=1+Math.max(-.45,Math.min(.45,slope*dir*1.2))}p.vx=dir*s;if(p.ground&&!dir)p.vx+=slope*2.2}
  if(c.J&&p.ground){p.vy=-13*(arena.jump||1);p.ground=false}
  p.cd-=dt;p.atk-=dt;
  if(c.A&&p.cd<=0&&p.w)attack(p,o);
  if(c.S&&!p.used&&elapsed()>=ABILITY_UNLOCK)ability(p,o);
  p.vy+=.6*(arena.grav||1);p.x+=p.vx;p.x=Math.max(30,Math.min(W-30,p.x));p.y+=p.vy;
  const g=terr(p.x);if(p.y>=g||(p.ground&&p.vy>=0&&g-p.y<18)){p.y=g;p.vy=0;p.ground=true}else p.ground=false;
  if(arena.hay&&p.ground&&Math.abs(p.x-480)<40){p.vy=-16;p.ground=false}}
 for(const b of projs){b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;b.life-=dt;const t=P[1-b.o],gy=terr(b.x);
  if(b.trap){if(b.y>=gy){traps.push({x:b.x,t:8,o:b.o});b.dead=1}continue}
  if(!b.dead&&Math.abs(b.x-t.x)<b.r&&Math.abs(b.y-(t.y-40))<b.r+20){if(hit(t,b.dmg,Math.sign(b.vx)||1,P[b.o],b.drop?{kb:12,up:8}:{})&&b.on)b.on(t);b.dead=1;if(b.drop)shake=12}
  if(b.y>=gy){if(b.bomb||b.drop){burst(b.x,gy,b.drop?'#e8282b':'#ffe135',20,7);shake=b.drop?10:6;if(Math.abs(b.x-t.x)<b.r)hit(t,b.dmg,Math.sign(t.x-b.x)||1,P[b.o],{kb:10,up:7})&&b.on&&b.on(t)}else burst(b.x,gy,'#cba',5,3);b.dead=1}
  if(b.x<-40||b.x>W+40||b.life<0)b.dead=1}

 for(const tr of traps){tr.t-=dt;if(tr.mark)continue;const t=P[1-tr.o];if(!tr.dead&&t.ground&&Math.abs(t.x-tr.x)<30){tr.dead=1;hit(t,8,t.face,P[tr.o],{kb:3,up:9});t.st.stun=1.8}}

// ---------- drawing helpers ----------
function txt(t,x,y,s,c='#fff',al='center'){ctx.font=`bold ${s}px -apple-system,Helvetica`;ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.lineWidth=s/6;ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=c;ctx.fillText(t,x,y)}
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,k=Math.abs(a);r=Math.round(r+(f-r)*k);g=Math.round(g+(f-g)*k);b=Math.round(b+(f-b)*k);return`rgb(${r},${g},${b})`}
function sphere(x,y,rx,ry,col){const g=ctx.createRadialGradient(x-rx*.35,y-ry*.4,Math.min(rx,ry)*.1,x,y,Math.max(rx,ry)*1.05);g.addColorStop(0,shade(col,.45));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.45));ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function spec(x,y,r){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}

// 3D-ish fruit, centered at (0,0) with radius r, facing f
function fruitBody(f,r){const n=f.n;
 if(n==='Banana'){ctx.save();ctx.rotate(-.35);const g=ctx.createLinearGradient(-r*.6,0,r*.6,0);g.addColorStop(0,'#c9a400');g.addColorStop(.35,'#fff27a');g.addColorStop(1,'#d4a800');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-r*1.15);ctx.quadraticCurveTo(r*1.05,-r*.2,r*.2,r*1.1);ctx.quadraticCurveTo(-r*.55,r*.3,0,-r*1.15);ctx.fill();ctx.fillStyle='#5a3d10';ctx.fillRect(-r*.08,-r*1.25,r*.16,r*.2);ctx.restore();spec(-r*.05,-r*.45,r*.3);return}
 if(n==='Strawberry'){const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r*1.2);g.addColorStop(0,'#ff8a9e');g.addColorStop(.5,'#e8203f');g.addColorStop(1,'#8a0f22');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-r,-r*.35);ctx.bezierCurveTo(-r,-r*1.05,r,-r*1.05,r,-r*.35);ctx.bezierCurveTo(r,r*.4,r*.2,r*1.05,0,r*1.1);ctx.bezierCurveTo(-r*.2,r*1.05,-r,r*.4,-r,-r*.35);ctx.fill();
  ctx.fillStyle='#ffe36a';for(let i=0;i<14;i++){const a=i*2.4,d=(i%4+1)/5;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.75*d,Math.sin(a)*r*.6*d+r*.15,r*.04,r*.07,0,0,7);ctx.fill()}
