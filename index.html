  txt(net&&net.rand?`${Math.floor(searchT)}s · searching`:net&&net.peer&&!net.host?`Joining room ${net.code} · ${Math.floor((performance.now()-net.t0)/1000)}s`:net&&net.code?`Room code: ${net.code}  —  tell your friend to tap "Join Room" and enter it`:`${Math.floor(searchT)}s · players seen in lobby: ${net?net.seen.size:0}`,W/2,398,17,'#fff');
  if(net&&net.code&&!net.rand)txt(net.code,W/2,130,54,'#fff');
  btn(SB.cancel,'Cancel','#e53935')}
 else{txt(menuMsg,W/2,200,menuMsg.length>40?19:28);if(state==='searchFail'){txt('Try a match against the computer instead?',W/2,250,20);btn(SB.cpu,'🤖 Play vs CPU','#43a047');btn(SB.retry,lastRoom?'🔄 Retry':'🔄 Keep searching','#1e88e5')}else txt('Returning to menu…',W/2,250,18);btn(SB.back,'Back','#757575')}}
function statusClick(g){if(state==='search'||state==='connecting'){if(inR(g,SB.cancel)){leaveNet(true);state='menu'}}
 else{if(state==='searchFail'&&inR(g,SB.cpu)){mode='cpu';layoutBtns();startMatch()}else if(state==='searchFail'&&inR(g,SB.retry)){if(lastRoom)goRoom(lastRoom.code,lastRoom.host);else goRoom('LOBBY',0,1)}else if(inR(g,SB.back)){state='menu'}}}
// --- iOS Safari add-to-home-screen banner + fullscreen helpers ---
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
function setupBanner(){if(!IOS||STANDALONE)return;try{if(localStorage.getItem('ffA2HS'))return}catch(e){}
 const b=document.getElementById('a2hs');b.style.display='flex';const ar=()=>document.getElementById('a2ar').textContent=matchMedia('(orientation:landscape)').matches?'↗️':'⬇️';ar();addEventListener('resize',ar);b.querySelector('button').onclick=e=>{e.stopPropagation();b.style.display='none';try{localStorage.setItem('ffA2HS','1')}catch(e){}}}
let fsTried=false;function tryFullscreen(){if(fsTried||STANDALONE)return;fsTried=true;const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f&&!/iPhone|iPod/.test(navigator.userAgent)){try{const r=f.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
addEventListener('touchend',tryFullscreen,{once:true});addEventListener('load',()=>{setupBanner();setTimeout(()=>scrollTo(0,1),100)});

let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();drawControls();drawQuit();requestAnimationFrame(loop)}requestAnimationFrame(loop);
['gesturestart','gesturechange','dblclick','selectstart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
addEventListener('orientationchange',()=>setTimeout(resize,200));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
